<main class="signin-page-container" aria-label="Sign In Page">
  <mat-card class="signin-form" appearance="raised">
    <div class="title-text">
      <h1>Personal Blog</h1>
      <p>Please sign in to continue.</p>
    </div>

    <mat-card-content>
      @if (isLoading()) {
      <div class="loading-state">
        <mat-spinner diameter="32"></mat-spinner>
        <p>Checking your session&hellip;</p>
      </div>
      } @else {
      <button
        matButton="filled"
        class="google-signin-button"
        type="button"
        (click)="onSignInWithGoogle()">
        <mat-icon>login</mat-icon>
        Sign in with Google
      </button>
      }
    </mat-card-content>

    <mat-card-footer class="signin-footer">
      <small>&copy; {{ year }} Gregory Wiley. All rights reserved.</small>
    </mat-card-footer>
  </mat-card>
</main>
