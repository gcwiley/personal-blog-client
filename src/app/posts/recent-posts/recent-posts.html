<mat-card class="recent-posts-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>Recent Posts</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-list class="recent-posts-list" aria-label="Recent Posts">
      @for (post of recentPosts(); track post.id; let last = $last) {
      <a mat-list-item [routerLink]="['/posts', post.id]" lines="2">
        <mat-icon matListItemIcon>article</mat-icon>
        <span matListItemTitle>{{ post.title }}</span>
        <span matListItemLine
          >Published: {{ post.publishedDate | date : 'mediumDate' }}</span
        >
      </a>
      @if (!last) {
      <mat-divider></mat-divider>
      } } @empty {
      <mat-list-item lines="2" role="status">
        <span matListItemTitle class="empty-state">No Recent Posts</span>
      </mat-list-item>
      }
    </mat-list>
  </mat-card-content>
</mat-card>
